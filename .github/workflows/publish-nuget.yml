name: Publish NuGet

# Публікує пакети у GitHub Packages при створенні релізу (тег),
# а також вручну через workflow_dispatch.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  NUGET_FEED: https://nuget.pkg.github.com/07artem132/index.json

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Install .NET
        uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5.2.0
        with:
          dotnet-version: 10.0.x

      # Спершу збираємо рішення (build тригерить завантаження signal-cli з перевіркою SHA-256),
      # потім пакуємо --no-build. Версії беремо з .csproj
      # (SignalCli.NET -> 2.0.0, SignalCli.Runtime -> 0.14.3.x).
      - name: Build (Release)
        run: dotnet build SignalCli.sln -c Release

      # Release-quality gate: жоден пакет не публікується, доки не пройде тестовий набір.
      # E2E виключено (Category!=E2E) — вони потребують живого signal-cli/JDK-оточення,
      # непридатного для release-раннера.
      - name: Test
        run: dotnet test Tests/SignalCli.Tests/SignalCli.Tests.csproj -c Release --no-build --filter "Category!=E2E"

      - name: Pack SignalCli.NET
        run: dotnet pack src/SignalCli/SignalCli.csproj -c Release --no-build -o "${{ github.workspace }}/nupkgs"

      # nf003-completion (audit v2.1 follow-up): без цього step'у lockstep двох пакетів
      # діє ТІЛЬКИ на csproj-стороні; на registry-стороні consumer отримує stale 3.0.0
      # HealthChecks-пакета бо нічого свіжіше не пушиться. RG07 (VersionLockstepTests)
      # ловить розбіжність у source-tree, цей крок гарантує що оновлення дійсно
      # доходить до nuget.pkg.github.com/07artem132/.
      - name: Pack SignalCli.NET.HealthChecks
        run: dotnet pack src/SignalCli.HealthChecks/SignalCli.HealthChecks.csproj -c Release --no-build -o "${{ github.workspace }}/nupkgs"

      - name: Pack SignalCli.Runtime
        run: dotnet pack src/SignalCli.runtime/SignalCli.runtime.csproj -c Release --no-build -o "${{ github.workspace }}/nupkgs"

      # Native runtime (Linux x64, без Java). Пакується на ubuntu-runner, де бінарник завантажено.
      - name: Pack SignalCli.Runtime.Native
        run: dotnet pack src/SignalCli.runtime.native/SignalCli.runtime.native.csproj -c Release --no-build -o "${{ github.workspace }}/nupkgs"

      # Bundled-JRE варіанти (Java в системі НЕ потрібна). JRE завантажується на
      # ubuntu-runner під час Pack (BeforeTargets="Build;Pack"); архіви Windows/macOS
      # тягнуться й розпаковуються незалежно від ОС раннера.
      - name: Pack SignalCli.Runtime.Jre.win-x64
        run: dotnet pack src/SignalCli.runtime.jre.win-x64/SignalCli.runtime.jre.win-x64.csproj -c Release --no-build -o "${{ github.workspace }}/nupkgs"

      - name: Pack SignalCli.Runtime.Jre.osx-arm64
        run: dotnet pack src/SignalCli.runtime.jre.osx-arm64/SignalCli.runtime.jre.osx-arm64.csproj -c Release --no-build -o "${{ github.workspace }}/nupkgs"

      - name: Push to GitHub Packages
        run: >
          dotnet nuget push "${{ github.workspace }}/nupkgs/*.nupkg"
          --source "${{ env.NUGET_FEED }}"
          --api-key "${{ secrets.GITHUB_TOKEN }}"
          --skip-duplicate

      - name: Upload packages as build artifact
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: nuget-packages
          path: ${{ github.workspace }}/nupkgs/*.nupkg
