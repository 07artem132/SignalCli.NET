name: E2E Tests (real signal-cli)

# G.7d (F7): запускає реальний signal-cli на трьох платформах через локальні
# рантайм-пакети (JRE bundle на win/macOS, native binary на Linux). Тестова
# матриця ізольована від основного юніт-CI, щоб довгі тести (JVM bootstrap)
# не блокували мерж основних змін.
on:
  push:
    branches: [ "main" ]
    paths:
      - 'src/**'
      - 'Tests/**'
      - '.github/workflows/e2e.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'src/**'
      - 'Tests/**'
      - '.github/workflows/e2e.yml'
  workflow_dispatch:

permissions:
  contents: read
  checks: write

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  e2e:
    strategy:
      fail-fast: false
      matrix:
        os: [ windows-latest, macos-14, ubuntu-latest ]
    runs-on: ${{ matrix.os }}
    env:
      Integration_Project: Tests/SignalCli.Tests.Integration/SignalCli.Tests.Integration.csproj

    steps:
    - name: Checkout
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

    - name: Install .NET 10
      uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
      with:
        dotnet-version: 10.0.x

    - name: Cache NuGet packages
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-e2e-${{ hashFiles('**/*.csproj') }}
        restore-keys: |
          ${{ runner.os }}-nuget-e2e-

    # Build викликає DownloadJre / DownloadSignalCli / DownloadSignalCliNative
    # таргети runtime-проєктів і копіює артефакти у TargetDir тестів.
    - name: Build integration tests
      run: dotnet build ${{ env.Integration_Project }} -c Release

    - name: Run E2E (Category=E2E)
      run: dotnet test ${{ env.Integration_Project }} -c Release --no-build --filter "Category=E2E" --logger "trx;LogFileName=e2e-${{ runner.os }}.trx"

    - name: Upload E2E test results
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: E2E Results (${{ matrix.os }})
        path: "**/TestResults/*.trx"
