name: E2E Tests (real signal-cli)

# G.7d (F7): запускає реальний signal-cli на трьох платформах через локальні
# рантайм-пакети (JRE bundle на win/macOS, native binary на Linux). Тестова
# матриця ізольована від основного юніт-CI, щоб довгі тести (JVM bootstrap)
# не блокували мерж основних змін.
on:
  push:
    branches: [ "main" ]
    paths:
      - 'src/**'
      - 'Tests/**'
      - '.github/workflows/e2e.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'src/**'
      - 'Tests/**'
      - '.github/workflows/e2e.yml'
  workflow_dispatch:

permissions:
  contents: read
  checks: write

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  e2e:
    strategy:
      fail-fast: false
      matrix:
        os: [ windows-latest, macos-14, ubuntu-latest ]
    runs-on: ${{ matrix.os }}
    env:
      Integration_Project: Tests/SignalCli.Tests.Integration/SignalCli.Tests.Integration.csproj

    steps:
    - name: Checkout
      uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

    - name: Install .NET 10
      uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5.2.0
      with:
        dotnet-version: 10.0.x

    - name: Cache NuGet packages
      uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-e2e-${{ hashFiles('**/*.csproj') }}
        restore-keys: |
          ${{ runner.os }}-nuget-e2e-

    # Build викликає DownloadJre / DownloadSignalCli / DownloadSignalCliNative
    # таргети runtime-проєктів і копіює артефакти у TargetDir тестів.
    - name: Build integration tests
      run: dotnet build ${{ env.Integration_Project }} -c Release

    - name: Run E2E (Category=E2E)
      run: dotnet test ${{ env.Integration_Project }} -c Release --no-build --filter "Category=E2E" --logger "trx;LogFileName=e2e-${{ runner.os }}.trx"

    - name: Upload E2E test results
      if: always()
      uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
      with:
        name: E2E Results (${{ matrix.os }})
        path: "**/TestResults/*.trx"
